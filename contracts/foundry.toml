[profile.default]
solc_version   = "0.8.30"
optimizer      = true
optimizer_runs = 200          # size-tuned: the controller embeds its children's creation code (EIP-3860)
via_ir         = true
src            = "src"
test           = "test"
script         = "script"
out            = "out"
libs           = ["lib"]
auto_detect_remappings = false
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read-write", path = "./test/vectors" },
]

[fuzz]
runs = 128

[rpc_endpoints]
anvil        = "http://127.0.0.1:8545"
base         = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

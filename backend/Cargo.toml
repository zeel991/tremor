[package]
name = "tremor-api"
version = "0.1.0"
edition = "2021"
description = "Tremor backend: indexes Aqua/SwapVM events, caches Chainlink rounds, serves read models"
build = "build.rs"

[[bin]]
name = "tremor-api"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
alloy = { version = "2.4.1", features = ["provider-http", "rpc-types", "sol-types", "contract", "json-abi", "json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", features = ["cors", "trace", "timeout"] }
tower = { version = "0.5", features = ["limit"] }
dotenvy = "0.15"
anyhow = "1"
thiserror = "2"
futures = "0.3"
async-trait = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
